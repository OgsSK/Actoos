<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60">
  <defs>
    <linearGradient id="leftGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#5BADE8"/>
      <stop offset="100%" style="stop-color:#3B9AD9"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2980B9"/>
      <stop offset="100%" style="stop-color:#1A5276"/>
    </linearGradient>
  </defs>
  <!-- Left shape (light blue parallelogram) -->
  <polygon points="5,55 20,5 30,5 20,55" fill="url(#leftGrad)"/>
  <!-- Right shape (dark blue triangle) -->
  <polygon points="15,55 30,5 45,55" fill="url(#rightGrad)"/>
  <!-- White inner triangle (the hole) -->
  <polygon points="21,45 25,30 29,45" fill="white"/>
  <!-- Text "Actoos" in white -->
  <text x="55" y="42" font-family="'Poppins', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="700" fill="white">Actoos</text>
</svg>
