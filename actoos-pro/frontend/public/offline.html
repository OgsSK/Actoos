<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actoos - Hors ligne</title>
  <link rel="icon" href="/actoos-favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      border-radius: 16px;
    }
    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      background: rgba(59, 130, 246, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 60px;
      height: 60px;
      color: #3b82f6;
    }
    h1 {
      color: #fff;
      font-size: 24px;
      margin-bottom: 12px;
    }
    p {
      color: #94a3b8;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #3b82f6;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2563eb;
    }
    .status {
      margin-top: 32px;
      padding: 16px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      font-size: 14px;
      margin: 8px 0;
    }
    .status-item.synced {
      color: #22c55e;
    }
    .status-item.pending {
      color: #f59e0b;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/actoos-logo.jpg" alt="Actoos" class="logo">
    
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414" />
      </svg>
    </div>
    
    <h1>Vous êtes hors ligne</h1>
    <p>
      Pas de connexion internet détectée. Vos données sont sauvegardées localement 
      et seront synchronisées automatiquement dès que la connexion sera rétablie.
    </p>
    
    <a href="/tech" class="btn" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Réessayer
    </a>
    
    <div class="status">
      <div class="status-item synced">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        Données locales disponibles
      </div>
      <div class="status-item pending" id="pending-status">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span id="pending-count">Vérification des actions en attente...</span>
      </div>
    </div>
  </div>
  
  <script>
    // Check for pending sync actions
    async function checkPendingActions() {
      try {
        const request = indexedDB.open('FieldCommandOffline', 1);
        request.onsuccess = () => {
          const db = request.result;
          if (db.objectStoreNames.contains('pendingActions')) {
            const tx = db.transaction('pendingActions', 'readonly');
            const store = tx.objectStore('pendingActions');
            const countReq = store.count();
            countReq.onsuccess = () => {
              const count = countReq.result;
              const el = document.getElementById('pending-count');
              if (count > 0) {
                el.textContent = `${count} action(s) en attente de synchronisation`;
              } else {
                el.textContent = 'Aucune action en attente';
                document.getElementById('pending-status').classList.remove('pending');
                document.getElementById('pending-status').classList.add('synced');
              }
            };
          }
        };
      } catch (e) {
        console.log('IndexedDB not available');
      }
    }
    
    // Check connection status
    window.addEventListener('online', () => {
      window.location.reload();
    });
    
    checkPendingActions();
  </script>
</body>
</html>
