<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 55">
  <defs>
    <linearGradient id="leftG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5BADE8"/>
      <stop offset="100%" style="stop-color:#3498D8"/>
    </linearGradient>
    <linearGradient id="rightG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2B7AB8"/>
      <stop offset="100%" style="stop-color:#1E5F8F"/>
    </linearGradient>
  </defs>
  <!-- Left parallelogram - lighter blue - SAME AS ICON -->
  <path d="M5,50 L18,5 L28,5 L20,50 Z" fill="url(#leftG)"/>
  <!-- Right triangle - darker blue - SAME AS ICON -->
  <path d="M15,50 L28,5 L45,50 L35,50 L28,30 L23,50 Z" fill="url(#rightG)"/>
  <!-- White inner triangle - SAME AS ICON -->
  <path d="M24,44 L28,34 L32,44 Z" fill="white"/>
  <!-- Text "Actoos" -->
  <text x="55" y="40" font-family="'Poppins', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#1E3A5F">Actoos</text>
</svg>
