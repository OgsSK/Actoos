<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGradient)"/>
  <!-- Clipboard Icon -->
  <g transform="translate(128, 96)">
    <!-- Clipboard body -->
    <rect x="32" y="48" width="192" height="256" rx="16" fill="white" opacity="0.95"/>
    <!-- Clipboard clip -->
    <rect x="80" y="16" width="96" height="64" rx="12" fill="white" opacity="0.95"/>
    <rect x="96" y="32" width="64" height="32" rx="8" fill="#2563EB"/>
    <!-- Lines on clipboard -->
    <rect x="64" y="112" width="128" height="12" rx="6" fill="#2563EB" opacity="0.3"/>
    <rect x="64" y="144" width="96" height="12" rx="6" fill="#2563EB" opacity="0.3"/>
    <rect x="64" y="176" width="112" height="12" rx="6" fill="#2563EB" opacity="0.3"/>
    <!-- Checkmark -->
    <circle cx="128" cy="248" r="40" fill="#10B981"/>
    <path d="M108 248 L122 262 L152 232" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
