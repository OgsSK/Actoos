<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Background fills entire icon -->
  <rect width="512" height="512" rx="108" fill="url(#bgGradient)"/>
  <!-- Simple "A" letter for Actoos Admin - like Moodle's "m" -->
  <text x="256" y="340" 
        font-family="SF Pro Display, -apple-system, Helvetica Neue, Arial, sans-serif" 
        font-size="280" 
        font-weight="700" 
        fill="white" 
        text-anchor="middle"
        letter-spacing="-10">A</text>
  <!-- Small checkmark accent -->
  <circle cx="380" cy="380" r="56" fill="#10B981"/>
  <path d="M355 380 L372 397 L410 359" stroke="white" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
