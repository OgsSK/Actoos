<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FB923C"/>
      <stop offset="100%" style="stop-color:#EA580C"/>
    </linearGradient>
  </defs>
  <!-- Orange background for Tech -->
  <rect width="512" height="512" rx="108" fill="url(#bgGradient)"/>
  <!-- Actoos Logo centered and scaled -->
  <g transform="translate(156, 106) scale(2)">
    <!-- Left shape (white for visibility on orange) -->
    <polygon points="10,110 40,10 60,10 40,110" fill="white" opacity="0.95"/>
    <!-- Right shape (slightly transparent white) -->
    <polygon points="30,110 60,10 90,110" fill="white" opacity="0.75"/>
    <!-- Inner triangle (orange to match background) -->
    <polygon points="42,90 50,60 58,90" fill="#EA580C"/>
  </g>
</svg>
